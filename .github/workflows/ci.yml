name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InternetVotingApplication.sln

      - name: Check formatting
        run: dotnet format InternetVotingApplication.sln --verify-no-changes --no-restore --exclude Migrations/

      - name: Build
        run: dotnet build InternetVotingApplication.sln -c Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test InternetVotingApplication.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --settings tests/coverage.runsettings
          --collect:"XPlat Code Coverage"

      - name: Coverage summary
        if: always()
        run: |
          FILE=$(find . -name coverage.cobertura.xml | head -n1)
          if [ -n "$FILE" ]; then
            python3 - "$FILE" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print(f"Line coverage: {float(root.get('line-rate'))*100:.1f}%  Branch coverage: {float(root.get('branch-rate'))*100:.1f}%")
          PY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
