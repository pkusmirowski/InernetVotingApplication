name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore InternetVotingApplication.sln

      - name: Check formatting
        run: dotnet format InternetVotingApplication.sln --verify-no-changes --no-restore --exclude Migrations/

      - name: Build
        run: dotnet build InternetVotingApplication.sln -c Release --no-restore

      - name: Test
        run: dotnet test InternetVotingApplication.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
