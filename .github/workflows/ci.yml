name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InternetVotingApplication.sln

      - name: Check formatting
        run: dotnet format InternetVotingApplication.sln --verify-no-changes --no-restore --exclude Migrations/

      - name: Build
        run: dotnet build InternetVotingApplication.sln -c Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test InternetVotingApplication.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --settings tests/coverage.runsettings
          --collect:"XPlat Code Coverage"

      # Fails the build when coverage drops below the agreed minimum (see docs/INSTRUKCJA.md, "Testy").
      - name: Coverage gate
        if: always()
        env:
          MIN_LINE: "97"
          MIN_BRANCH: "88"
        run: |
          FILE=$(find . -name coverage.cobertura.xml | head -n1)
          if [ -z "$FILE" ]; then echo "No coverage report found"; exit 1; fi
          python3 - "$FILE" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          line, branch = float(root.get('line-rate')) * 100, float(root.get('branch-rate')) * 100
          min_line, min_branch = float(os.environ['MIN_LINE']), float(os.environ['MIN_BRANCH'])
          print(f"Line coverage: {line:.1f}% (minimum {min_line:.0f}%)  Branch coverage: {branch:.1f}% (minimum {min_branch:.0f}%)")
          if line < min_line or branch < min_branch:
              print("::error::Code coverage is below the minimum")
              sys.exit(1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
